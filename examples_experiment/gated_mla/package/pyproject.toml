[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-mla-ascend-candidate"
version = "0.1.0a0"
description = "Isolated selected-kernel Gated MLA forward candidate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["gmla*"]

[tool.setuptools.package-data]
"gmla.kernels" = ["design.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "npu: requires a real NPU; absence is a failure when selected",
  "low_priority: extended cases for daily/full runs",
  "ci_skip: only known hardware/instability issues with a recorded issue",
]
